name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
          pip install homeassistant==2026.1.3
          pip install pymodbus>=3.6.9
      - name: Run tests
        run: |
          pytest -q
